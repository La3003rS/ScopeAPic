[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeapic"
version = "0.3.0"
description = "Local-first photo intelligence and metadata analysis."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pillow",
    "pillow-heif",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]
