[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeapic"
version = "0.2.0"
description = "Photo intelligence and deep metadata analysis."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pillow",
    "pillow-heif",
    "pydantic",
]

[tool.setuptools.packages.find]
where = ["src"]
